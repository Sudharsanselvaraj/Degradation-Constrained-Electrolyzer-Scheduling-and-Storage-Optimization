<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#072B23;">
  <defs>
    <pattern id="mpc_grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#mpc_grid)"/>
  
  <text x="40" y="60" font-family="monospace" font-size="14" fill="#E5F937" letter-spacing="2">[CHANCE-CONSTRAINED MPC FORMULATION]</text>
  <text x="40" y="95" font-family="sans-serif" font-size="24" font-weight="300" fill="#ffffff">Confidence-Aware Health Frontier</text>
  
  <!-- Graph Axes -->
  <g transform="translate(80, 130)">
    <line x1="40" y1="280" x2="650" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <line x1="40" y1="20" x2="40" y2="280" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <text x="650" y="305" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="end">Time Horizon (t ... t+N)</text>
    <text x="30" y="15" font-family="monospace" font-size="12" fill="#94a3b8">Stack Health Envelope H(t)</text>
    
    <!-- P90, P50, P10 uncertainty fan -->
    <path d="M 40 80 Q 200 70, 350 90 T 630 140 L 630 240 Q 450 200, 350 170 T 40 120 Z" fill="rgba(229, 249, 55, 0.12)" stroke="none"/>
    
    <!-- P90 Upper Bound -->
    <path d="M 40 80 Q 200 70, 350 90 T 630 140" fill="none" stroke="#E5F937" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="635" y="145" font-family="monospace" font-size="10" fill="#E5F937">P90 Optimistic</text>
    
    <!-- Median Forecast P50 -->
    <path d="M 40 100 Q 200 85, 350 125 T 630 185" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="635" y="190" font-family="monospace" font-size="10" fill="#ffffff">P50 Expected</text>
    
    <!-- Lower Confidence Bound H_LCB (Conservative) -->
    <path d="M 40 120 Q 200 110, 350 170 T 630 240" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="635" y="245" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">H_LCB (μ_H - 1.96σ_H)</text>

    <!-- Safe operating threshold -->
    <line x1="40" y1="255" x2="630" y2="255" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="45" y="250" font-family="monospace" font-size="10" fill="#ef4444">DEGRADATION LIMIT (SAFE CONSTRAINT)</text>
    
    <!-- Current Dispatch Marker -->
    <circle cx="40" cy="100" r="5" fill="#E5F937"/>
    <text x="45" y="90" font-family="monospace" font-size="11" fill="#E5F937">t = 0 (Dispatch)</text>
  </g>
</svg>